<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function calculate() {
      const a = parseFloat(document.getElementById("num1").value) || 0;
      const b = parseFloat(document.getElementById("num2").value) || 0;
      const result = a + b;
      document.getElementById("result").innerText = "Результат: " + result;
    }
  </script>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Главная</a></li>
        <li><a href="electro.html">Электрика</a></li>
        <li><a href="lowvoltage.html">Слаботочка</a></li>
        <li><a href="calc.html">Калькулятор</a></li>
        <li><a href="contacts.html">Контакты</a></li>
      </ul>
    </nav>
  </header>

  <section class="calc">
    <div class="content">
      <h1>Калькулятор</h1>
      <p>Простой калькулятор для расчётов</p>
      <input type="number" id="num1" placeholder="Введите число 1">
      <input type="number" id="num2" placeholder="Введите число 2">
      <button class="btn" onclick="calculate()">Посчитать</button>
      <p id="result"></p>
    </div>
  </section>
</body>
</html>
